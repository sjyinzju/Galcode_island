[package]
name = "galcode_island"
version = "1.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "galcode_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 自动更新：plugin-updater 负责检查 / 下载 / 安装；plugin-process 提供 relaunch
# 让 macOS app bundle 替换式更新后能由前端显式重启（Windows passive nsis 也用它统一）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 系统级通知：长任务结束时弹原生通知（macOS Notification Center / Win Toast / Linux libnotify）。
# Dock badge / 任务栏数字角标用 Tauri 内置 Window.setBadgeCount，不需要额外 plugin。
tauri-plugin-notification = "2"
# HTTP 客户端 plugin：前端的 `fetch()` 走 Rust 端 reqwest，绕开 macOS WKWebView
# 对 tauri:// 跨域 fetch 的"Load failed"限制。前端只在 isTauri 模式下使用此 plugin，
# LAN 浏览器端仍用 window.fetch。
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"

# 局域网移动端访问：内置 HTTP 服务（同步、零异步开销）+ 密码哈希 / 随机 token
tiny_http = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
fs2 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
