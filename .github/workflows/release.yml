# 发版流水线：tag push 触发 → 双平台并行构建 → 合并 → 发 GitHub Release + 推 R2
#
# 触发方式：`npm run release 0.2.0` 本地推 tag，或者 Actions 页手动 dispatch。
# 所有 secrets 放在 `release` environment 里；workflow 首次运行会停在
# Waiting for review，到 Actions 页面点 Approve 才开始跑。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (如 v0.2.0，必须已经存在)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Job 1：macOS Apple Silicon 构建 + 公证
  # （macOS Intel 已弃支 —— Apple Silicon 用户占大多数，且 macos-13 runner 排队长）
  # ------------------------------------------------------------------
  build-macos-arm64:
    name: Build · macOS arm64
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -e
          CERT_PATH=$RUNNER_TEMP/build-cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # 诊断：校验 APPLE_SIGNING_IDENTITY secret 是否匹配 keychain 中的证书。
      # 上一次发版挂在 `no identity found`，根因通常是 secret 值跟证书 CN 对不上。
      # （这段是参考项目的踩坑修复，必须保留）
      - name: Verify APPLE_SIGNING_IDENTITY matches keychain certificate
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
        run: |
          set -e
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" > "$RUNNER_TEMP/identities.txt"
          echo "--- identities in custom keychain ---"
          cat "$RUNNER_TEMP/identities.txt"
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "✗ APPLE_SIGNING_IDENTITY secret 为空"
            exit 1
          fi
          if ! grep -qF "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/identities.txt"; then
            echo "✗ APPLE_SIGNING_IDENTITY 与 keychain 里的证书 CN 不一致"
            echo "  secret 字符数: $(printf '%s' "$APPLE_SIGNING_IDENTITY" | wc -c)"
            echo "  （若字符数看起来多 1，多半是末尾带了换行 — 重新粘贴时去掉尾部空白）"
            exit 1
          fi
          echo "✓ APPLE_SIGNING_IDENTITY 与 keychain 证书匹配"

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled runtime (sign macOS native binaries)
        # prepare-runtime.mjs 内部 npm install claude/codex/opencode 到 tmp，
        # 找到 native binary 后复制到 src-tauri/resources/runtime/<platform>-<arch>/
        # 加 --sign 标志：对每个 binary 做 codesign + 附加 JIT entitlements
        # （node / codex / opencode 等 JIT 引擎在 hardened runtime 下必须）
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/prepare-runtime.mjs --sign

      - name: Build Tauri bundle (.app only — 后续手动 DMG + tar.gz)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 传 APPLE_SIGNING_IDENTITY：让 tauri 自己跑一遍 codesign --deep --force
          # 把整个 .app 内部都签一遍，建立完整签名链。这一步会把我们给 bundled CLI
          # 加的 JIT entitlements 覆盖掉，但**这是预期** —— 后续 fix-bundle-signatures
          # 用 --force 重新签给 JIT binary 加回 entitlements。
          # 不传的话 tauri 会跳过签名，DMG 创建 / 公证 / fix-bundle 都会因为内部
          # binary 未签报"resource not signed"。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app

      - name: Fix bundle signatures (manual codesign with JIT entitlements)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/fix-bundle-signatures.mjs

      - name: Notarize & create DMG + updater tarball
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-and-notarize.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dist/*
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 2：Windows x64 构建
  # ------------------------------------------------------------------
  build-windows:
    name: Build · Windows x64
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled runtime
        # Windows 上 prepare-runtime.mjs 拉到 windows-x64 binary，签名步骤跳过
        # （tauri build 自己会用 NSIS 签 .exe，bundled binary 不强制单独签）
        run: node scripts/prepare-runtime.mjs

      - name: Build Tauri bundle (NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Sign installer & generate latest.json fragment
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-windows-updater.mjs

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p windows-out
          cp src-tauri/target/release/bundle/nsis/*.exe windows-out/ || true
          cp src-tauri/target/release/bundle/nsis/*.sig windows-out/ || true
          cp src-tauri/target/release/bundle/nsis/latest.json windows-out/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: windows-out/*
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 3：合并 + 发 GitHub Release + 推 R2 + Purge CF
  # ------------------------------------------------------------------
  publish:
    name: Publish
    needs: [build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install minimal deps (aws-sdk)
        run: npm ci --omit=optional

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag & version
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Release notes 优先级：notes/<tag>.md > tag annotation > 兜底标题
          #
          # 为什么文件优先：release.mjs 已经把当版日志原样归档到 notes/<tag>.md，
          # 它是源真值；tag annotation 经过 git cleanup 处理，历史上出现过
          # Markdown 小标题（以 # 开头）被当成注释剥掉的事故。文件兜底能让
          # workflow_dispatch 重跑老 tag 时也拿到完整的日志。
          NOTES_FILE=release-notes.md
          if [ -f "notes/$TAG.md" ]; then
            cp "notes/$TAG.md" "$NOTES_FILE"
          elif git rev-parse -q --verify "refs/tags/$TAG" > /dev/null 2>&1; then
            git tag -l --format='%(contents)' "$TAG" > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Galcode Island $TAG" > "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Compose latest.json (GitHub + R2 variants)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.notes_file }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-compose-latest-json.mjs

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*-setup.exe" -o \
            -name "*.tar.gz" -o \
            -name "*.nsis.zip" -o \
            -name "*.sig" \
          \) -exec cp {} release-assets/ \;
          cp dist-release/latest.github.json release-assets/latest.json
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Galcode Island ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          draft: false
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Upload mirror to R2
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/ci-upload-r2.mjs

      - name: Prune old versions on R2
        env:
          CURRENT_VERSION: ${{ steps.meta.outputs.version }}
          RETAIN_VERSIONS: ${{ vars.R2_RETAIN_VERSIONS || '2' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/ci-prune-r2.mjs

      - name: Purge Cloudflare cache for latest.json
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: node scripts/ci-purge-cf.mjs

      - name: Summary
        run: |
          echo "### ✅ Release ${{ steps.meta.outputs.tag }} published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- R2: ${{ secrets.R2_PUBLIC_BASE }}/latest.json" >> "$GITHUB_STEP_SUMMARY"
